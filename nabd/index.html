<style>
/* Layout: mobile-first single column with bottom tab bar; 2-column stage+panel from 900px. Ink-blue lab surfaces, teal controls, coral/amber reserved for muscle activation. */

  --accent:#3cc2ba; --accent-ink:#04211f; --accent-soft:#11302f; --m-prim:#ff6040; --m-sec:#ffb444; --m-base:#7a5557; --skin:#4a5767;
  --good:#4cc17d; --warn:#e8a23a; --bad:#ff6b5b; --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --thumb-a:#e9eef2; --thumb-b:#d5dde4; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#3cc2ba; --accent-ink:#04211f; --accent-soft:#11302f; --m-prim:#ff6040; --m-sec:#ffb444; --m-base:#7a5557; --skin:#4a5767;
  --good:#4cc17d; --warn:#e8a23a; --bad:#ff6b5b; --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --thumb-a:#e9eef2; --thumb-b:#d5dde4; color-scheme:dark}
*{box-sizing:border-box}

p{margin:0 0 .7em} a{color:var(--accent)} small,.small{font-size:.84rem} .muted{color:var(--muted)} .mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)} .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn.primary:hover{filter:brightness(1.06)}

.chip:has(input:focus-visible){outline:2px solid var(--accent)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}

input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0} .field>label,legend{font-weight:600;font-size:.9rem}

.row2{display:grid;gap:12px} .row3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)} @media(min-width:640px){.row2{grid-template-columns:1fr 1fr}}
.grid2,.grid3,.grid4{display:grid;gap:14px} @media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}} .grid4{grid-template-columns:1fr 1fr} @media(min-width:900px){.grid4{grid-template-columns:repeat(4,1fr)}}
.page-head{display:flex;flex-direction:column;gap:2px} .page-head.row{flex-direction:row;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:8px 0} .bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}

.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px} .mdot.prim{background:var(--m-prim)} .mdot.sec{background:var(--m-sec)}

.toast{position:fixed;inset:auto 16px calc(80px + env(safe-area-inset-bottom,0px)) 16px;margin:auto;max-width:380px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;z-index:50;box-shadow:var(--sh)} @media(min-width:900px){.toast{bottom:24px}}

/* home */
.resume{display:flex;flex-direction:column;background:var(--accent);color:var(--accent-ink);padding:12px 16px;border-radius:var(--r);text-decoration:none}
.hero-home h1{margin:0}
.quick{display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--accent)} .quick-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px} .quick-head h2{margin:0}
.preview{list-style:none;margin:4px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.preview li{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.92rem} .preview li:last-child{border:0} .preview li a{color:var(--ink);text-decoration:none;font-weight:500} .preview li.ph{background:var(--surface2);justify-content:flex-start;font-size:.84rem;color:var(--muted)}
.tag{font-size:.72rem;padding:1px 8px;border-radius:999px;font-weight:600;flex:none} .tag.warm{background:color-mix(in srgb,var(--m-sec) 22%,transparent);color:var(--warn)} .tag.cool{background:var(--accent-soft);color:var(--accent)}
.quick-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px} .quick-foot .est{flex:1;min-width:140px;font-weight:600} .quick-foot .big{flex:1 1 220px}
.stat{display:flex;flex-direction:column;gap:2px} .stat .n{font-family:var(--font-d);font-size:1.8rem;font-variant-numeric:tabular-nums} .stat .n small{font-size:.9rem;color:var(--muted)} .up{color:var(--good);font-size:.82rem} .down{color:var(--bad);font-size:.82rem}
.rec-row{font-size:.9rem;margin:4px 0;display:flex;gap:6px;align-items:baseline}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px} .badge{background:color-mix(in srgb,var(--m-sec) 18%,transparent);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:.8rem}
.cta-onb{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}

.xlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column} .xlist li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)} .xlist a{text-decoration:none;font-weight:500}

.mgroup{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}

.excard h3{margin:0;padding-inline-end:30px} .excat{font-size:.74rem;color:var(--accent);font-weight:600} .mus{font-size:.84rem;margin:0}

.lvl{display:inline-flex;align-items:center;gap:2px} .lvl i{width:6px;height:12px;border-radius:2px;background:var(--line)} .lvl i.on{background:var(--accent)} .lvl b{font-weight:500;margin-inline-start:4px}
.fav{position:absolute;top:10px;inset-inline-end:10px;border:0;background:none;cursor:pointer;color:var(--muted);padding:4px} .fav.on{color:var(--m-sec)} .fav.on .ic{fill:currentColor}

.editor{display:flex;flex-direction:column;gap:10px} .ed-sum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;background:var(--surface2);padding:10px 12px;border-radius:10px} .ed-fit{display:flex;gap:6px} .ed-fit select{width:auto}

.ed-act{display:flex;gap:8px}
